<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Resume bot deterministic evaluation results</title>
  <desc id="desc">All 41 deterministic cases passed across six public test categories.</desc>
  <defs>
    <style>
      .bg { fill: #07111c; }
      .title { fill: #f4f7fa; font: 700 30px system-ui, sans-serif; }
      .sub { fill: #aebdca; font: 17px ui-monospace, monospace; }
      .label { fill: #e8f0f5; font: 18px system-ui, sans-serif; }
      .count { fill: #07111c; font: 700 18px ui-monospace, monospace; }
      .bar { fill: #19c8e6; }
      .safe { fill: #28d17c; }
      .grid { stroke: #284052; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="560" rx="24"/>
  <text class="title" x="55" y="65">Deterministic red-team and grounding gate</text>
  <text class="sub" x="55" y="102">41 / 41 passed · metadata-only evidence</text>
  <line class="grid" x1="250" y1="145" x2="250" y2="505"/>
  <text class="label" x="55" y="185">Answerable</text><rect class="bar" x="250" y="158" width="600" height="38" rx="8"/><text class="count" x="820" y="184" text-anchor="middle">12</text>
  <text class="label" x="55" y="245">Attack</text><rect class="safe" x="250" y="218" width="450" height="38" rx="8"/><text class="count" x="670" y="244" text-anchor="middle">9</text>
  <text class="label" x="55" y="305">Private</text><rect class="safe" x="250" y="278" width="350" height="38" rx="8"/><text class="count" x="570" y="304" text-anchor="middle">7</text>
  <text class="label" x="55" y="365">Unsupported</text><rect class="safe" x="250" y="338" width="350" height="38" rx="8"/><text class="count" x="570" y="364" text-anchor="middle">7</text>
  <text class="label" x="55" y="425">Educational</text><rect class="bar" x="250" y="398" width="200" height="38" rx="8"/><text class="count" x="420" y="424" text-anchor="middle">4</text>
  <text class="label" x="55" y="485">Malformed</text><rect class="safe" x="250" y="458" width="100" height="38" rx="8"/><text class="count" x="320" y="484" text-anchor="middle">2</text>
  <rect class="safe" x="905" y="158" width="140" height="78" rx="16"/>
  <text class="count" x="975" y="190" text-anchor="middle">PASS</text>
  <text class="count" x="975" y="218" text-anchor="middle">41 / 41</text>
</svg>
