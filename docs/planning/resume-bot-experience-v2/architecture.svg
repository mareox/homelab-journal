<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Resume Bot Experience v2 public architecture</title>
  <desc id="desc">A public GitHub Pages resume sends a Turnstile-protected request through DNS and Caddy to an Atlas FastAPI service backed by Ollama.</desc>
  <defs>
    <style>
      .bg { fill: #07111c; }
      .card { fill: #122230; stroke: #19c8e6; stroke-width: 2; }
      .trust { fill: #103026; stroke: #28d17c; stroke-width: 2; }
      .title { fill: #f4f7fa; font: 700 26px system-ui, sans-serif; }
      .label { fill: #f4f7fa; font: 650 20px system-ui, sans-serif; }
      .detail { fill: #aebdca; font: 16px ui-monospace, monospace; }
      .arrow { stroke: #f2c94c; stroke-width: 4; fill: none; marker-end: url(#head); }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2c94c"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="420" rx="24"/>
  <text class="title" x="56" y="66">Source-grounded resume assistant</text>
  <rect class="card" x="55" y="135" width="200" height="125" rx="16"/>
  <text class="label" x="155" y="185" text-anchor="middle">GitHub Pages</text>
  <text class="detail" x="155" y="220" text-anchor="middle">resume UI</text>
  <rect class="trust" x="295" y="55" width="200" height="105" rx="16"/>
  <text class="label" x="395" y="98" text-anchor="middle">Turnstile</text>
  <text class="detail" x="395" y="130" text-anchor="middle">every Ask / Retry</text>
  <rect class="card" x="360" y="195" width="200" height="125" rx="16"/>
  <text class="label" x="460" y="245" text-anchor="middle">DNS / Caddy</text>
  <text class="detail" x="460" y="280" text-anchor="middle">public HTTPS route</text>
  <rect class="trust" x="665" y="135" width="210" height="125" rx="16"/>
  <text class="label" x="770" y="185" text-anchor="middle">Atlas FastAPI</text>
  <text class="detail" x="770" y="220" text-anchor="middle">bounded public RAG</text>
  <rect class="card" x="970" y="135" width="175" height="125" rx="16"/>
  <text class="label" x="1058" y="185" text-anchor="middle">Ollama</text>
  <text class="detail" x="1058" y="220" text-anchor="middle">one model call</text>
  <path class="arrow" d="M255 218 L360 250"/>
  <path class="arrow" d="M560 250 L665 218"/>
  <path class="arrow" d="M875 198 L970 198"/>
  <path class="arrow" d="M395 160 L395 195"/>
  <text class="detail" x="600" y="370" text-anchor="middle">Public resume evidence only · no tools · no durable transcript</text>
</svg>
