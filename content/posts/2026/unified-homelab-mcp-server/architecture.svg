<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="svcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f3d3a"/>
    </linearGradient>
    <linearGradient id="cliGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.4"/></filter>
    <filter id="softShadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/></marker>
  </defs>
  <rect width="900" height="620" fill="url(#bg)"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e2e8f0">Unified Homelab MCP Server — Source Architecture (Sept 2026)</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="#94a3b8">Local stdio + CLI only · up to 25 read-only tools · 15 documentation resources · 10 configured backends</text>
  <rect x="22" y="80" width="196" height="220" rx="10" fill="url(#clientGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="120" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#6ee7b7">LOCAL MCP CLIENTS</text>
  <rect x="36" y="118" width="168" height="52" rx="6" fill="#0f3d3a" stroke="#22c55e" stroke-width="0.8"/><text x="120" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#d1fae5">Claude Code</text><text x="120" y="156" text-anchor="middle" font-size="9" fill="#94a3b8">project .mcp.json entry</text>
  <rect x="36" y="182" width="168" height="52" rx="6" fill="#0f3d3a" stroke="#22c55e" stroke-width="0.8"/><text x="120" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#d1fae5">AI agent sessions</text><text x="120" y="220" text-anchor="middle" font-size="9" fill="#94a3b8">any local MCP client</text>
  <text x="120" y="272" text-anchor="middle" font-size="9" fill="#94a3b8">no remote transport:</text><text x="120" y="286" text-anchor="middle" font-size="9" fill="#94a3b8">SSE/HTTP was never deployed</text>
  <rect x="22" y="330" width="196" height="110" rx="10" fill="url(#cliGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="120" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#d8b4fe">TERMINAL CALLER</text><rect x="36" y="368" width="168" height="52" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="0.8"/><text x="120" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#e9d5ff">homelab-mcp-cli</text><text x="120" y="406" text-anchor="middle" font-size="9" fill="#94a3b8">uv run … &lt;tool&gt; '&lt;json args&gt;'</text>
  <line x1="218" y1="190" x2="278" y2="220" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/><text x="248" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">stdio</text><line x1="218" y1="385" x2="278" y2="356" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/><text x="248" y="386" text-anchor="middle" font-size="10" font-weight="600" fill="#c4b5fd">in-process</text>
  <rect x="282" y="80" width="256" height="360" rx="12" fill="url(#mcpGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/><text x="410" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">homelab-mcp (FastMCP)</text><text x="410" y="126" text-anchor="middle" font-size="10" fill="#dbeafe">local stdio server · single process</text>
  <rect x="298" y="140" width="224" height="66" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="0.8"/><text x="410" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#dbeafe">Config Loader</text><text x="410" y="176" text-anchor="middle" font-size="9" fill="#bfdbfe">per-service settings, conditional</text><text x="410" y="190" text-anchor="middle" font-size="9" fill="#bfdbfe">registration on credentials</text>
  <rect x="298" y="216" width="224" height="66" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="0.8"/><text x="410" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#dbeafe">Read-only tool surface</text><text x="410" y="252" text-anchor="middle" font-size="9" fill="#bfdbfe">up to 25 tools, every tool carries</text><text x="410" y="266" text-anchor="middle" font-size="9" fill="#bfdbfe">readOnlyHint — no write tools exist</text>
  <rect x="298" y="292" width="224" height="66" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="0.8"/><text x="410" y="312" text-anchor="middle" font-size="11" font-weight="600" fill="#dbeafe">Documentation resources</text><text x="410" y="328" text-anchor="middle" font-size="9" fill="#bfdbfe">15 homelab:// docs: infrastructure,</text><text x="410" y="342" text-anchor="middle" font-size="9" fill="#bfdbfe">standards, pitfalls, service guides</text>
  <text x="410" y="382" text-anchor="middle" font-size="9" fill="#dbeafe">graceful degradation: missing</text><text x="410" y="396" text-anchor="middle" font-size="9" fill="#dbeafe">credentials mean those tools</text><text x="410" y="410" text-anchor="middle" font-size="9" fill="#dbeafe">stay unregistered; server starts</text>
  <rect x="282" y="460" width="256" height="74" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="410" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#fbbf24">READ-ONLY BOUNDARY</text><text x="410" y="498" text-anchor="middle" font-size="9" fill="#fde68a">lifecycle writes stay Semaphore-owned</text><text x="410" y="512" text-anchor="middle" font-size="9" fill="#fde68a">(Ansible templates + Nautobot lifecycle)</text><text x="410" y="526" text-anchor="middle" font-size="9" fill="#fde68a">no state-changing MCP tool is exposed</text>
  <line x1="538" y1="260" x2="596" y2="260" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue)"/><text x="567" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">async httpx</text><text x="567" y="278" text-anchor="middle" font-size="9" fill="#94a3b8">read calls only</text>
  <!-- SERVICE BACKENDS --><rect x="600" y="80" width="278" height="490" rx="10" fill="url(#svcGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#softShadow)"/><text x="739" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#93c5fd">SERVICE BACKENDS (async httpx)</text>
  <rect x="614" y="116" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="135" font-size="10" font-weight="600" fill="#dbeafe">Proxmox VE</text><text x="838" y="135" text-anchor="end" font-size="9" fill="#94a3b8">4 tools · cluster + guests</text>
  <rect x="614" y="152" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="171" font-size="10" font-weight="600" fill="#dbeafe">Pi-hole DNS</text><text x="838" y="171" text-anchor="end" font-size="9" fill="#94a3b8">2 tools · records + lookup</text>
  <rect x="614" y="188" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="207" font-size="10" font-weight="600" fill="#dbeafe">Prometheus</text><text x="838" y="207" text-anchor="end" font-size="9" fill="#94a3b8">2 tools · PromQL + alerts</text>
  <rect x="614" y="224" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="243" font-size="10" font-weight="600" fill="#dbeafe">Graylog</text><text x="838" y="243" text-anchor="end" font-size="9" fill="#94a3b8">1 tool · log search</text>
  <rect x="614" y="260" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="279" font-size="10" font-weight="600" fill="#dbeafe">Semaphore</text><text x="838" y="279" text-anchor="end" font-size="9" fill="#94a3b8">3 tools · projects/templates/tasks</text>
  <rect x="614" y="296" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="315" font-size="10" font-weight="600" fill="#dbeafe">Caddy</text><text x="838" y="315" text-anchor="end" font-size="9" fill="#94a3b8">2 tools · sites + config</text>
  <rect x="614" y="332" width="250" height="30" rx="5" fill="#14532d" stroke="#22c55e" stroke-width="1"/><text x="626" y="351" font-size="10" font-weight="700" fill="#bbf7d0">Nautobot (IPAM)</text><text x="838" y="351" text-anchor="end" font-size="9" fill="#86efac">2 tools · device/VM + IP</text>
  <rect x="614" y="368" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="387" font-size="10" font-weight="600" fill="#dbeafe">n8n</text><text x="838" y="387" text-anchor="end" font-size="9" fill="#94a3b8">2 tools · workflows + runs</text>
  <rect x="614" y="404" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="423" font-size="10" font-weight="600" fill="#dbeafe">PBS</text><text x="838" y="423" text-anchor="end" font-size="9" fill="#94a3b8">1 tool · backup status</text>
  <rect x="614" y="440" width="250" height="30" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.6"/><text x="626" y="459" font-size="10" font-weight="600" fill="#dbeafe">PAN-OS firewall</text><text x="838" y="459" text-anchor="end" font-size="9" fill="#94a3b8">5 tools · status/audit/upgrade checks</text>
  <rect x="614" y="478" width="250" height="40" rx="5" fill="#1e1b2e" stroke="#f59e0b" stroke-width="0.8"/><text x="626" y="494" font-size="10" font-weight="600" fill="#fde68a">service_health</text><text x="626" y="508" font-size="9" fill="#94a3b8">cross-service parallel check (1 tool)</text>
  <text x="739" y="534" text-anchor="middle" font-size="9" fill="#94a3b8">Nautobot replaced NetBox as the IPAM</text><text x="739" y="546" text-anchor="middle" font-size="9" fill="#94a3b8">backend source; NetBox is retained</text><text x="739" y="558" text-anchor="middle" font-size="9" fill="#94a3b8">rollback-only, not an MCP backend</text>
  <text x="450" y="588" text-anchor="middle" font-size="10" fill="#64748b">Figure shows the verified source architecture. Live activation of each backend is verified separately.</text><text x="450" y="604" text-anchor="middle" font-size="10" fill="#64748b">Role labels only — no real hostnames or addresses.</text>
</svg>
