<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="900" height="452" fill="#0f172a"/>

  <text x="450" y="24" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Second Brain Architecture</text>
  <text x="450" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">persistent memory for a stateless assistant</text>

  <!-- ══ Layer 1: curated memory ══ -->
  <rect x="24" y="52" width="600" height="78" rx="8" fill="url(#panelBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="40" y="70" fill="#fcd34d" font-size="10" font-weight="700" letter-spacing="0.5">LAYER 1: CURATED MEMORY</text>
  <text x="608" y="70" text-anchor="end" fill="#94a3b8" font-size="9">auto-loaded every session</text>

  <rect x="40" y="80" width="110" height="24" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="95" y="96" text-anchor="middle" fill="#fde68a" font-size="9">MEMORY.md</text>
  <rect x="162" y="80" width="120" height="24" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="222" y="96" text-anchor="middle" fill="#fde68a" font-size="9">200-line budget</text>
  <rect x="294" y="80" width="115" height="24" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="351" y="96" text-anchor="middle" fill="#fde68a" font-size="9">rotated weekly</text>

  <text x="40" y="122" fill="#94a3b8" font-size="8.5">identity and preferences, active projects, decisions, recent context</text>

  <!-- ══ Layer 2: daily chronicle ══ -->
  <rect x="24" y="142" width="600" height="78" rx="8" fill="url(#panelBg)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="40" y="160" fill="#93c5fd" font-size="10" font-weight="700" letter-spacing="0.5">LAYER 2: DAILY CHRONICLE</text>
  <text x="608" y="160" text-anchor="end" fill="#94a3b8" font-size="9">hook-automated</text>

  <rect x="40" y="170" width="160" height="24" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="120" y="186" text-anchor="middle" fill="#bfdbfe" font-size="9">memory/YYYY-MM-DD.md</text>
  <rect x="212" y="170" width="130" height="24" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="277" y="186" text-anchor="middle" fill="#bfdbfe" font-size="9">session summaries</text>
  <rect x="354" y="170" width="140" height="24" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="424" y="186" text-anchor="middle" fill="#bfdbfe" font-size="9">decisions + follow-ups</text>

  <text x="40" y="212" fill="#94a3b8" font-size="8.5">PreCompact flush, SessionStart load, SessionEnd summary</text>

  <!-- ══ Layer 3: searchable knowledge ══ -->
  <rect x="24" y="232" width="600" height="78" rx="8" fill="url(#panelBg)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="40" y="250" fill="#67e8f9" font-size="10" font-weight="700" letter-spacing="0.5">LAYER 3: SEARCHABLE KNOWLEDGE</text>
  <text x="608" y="250" text-anchor="end" fill="#94a3b8" font-size="9">MCP vector search</text>

  <rect x="40" y="260" width="95" height="24" rx="5" fill="#1e293b" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="87" y="276" text-anchor="middle" fill="#a5f3fc" font-size="9">ChromaDB</text>
  <rect x="147" y="260" width="135" height="24" rx="5" fill="#1e293b" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="214" y="276" text-anchor="middle" fill="#a5f3fc" font-size="9">bge-small-en-v1.5</text>
  <rect x="294" y="260" width="115" height="24" rx="5" fill="#1e293b" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="351" y="276" text-anchor="middle" fill="#a5f3fc" font-size="9">nightly reindex</text>

  <text x="40" y="302" fill="#94a3b8" font-size="8.5">semantic cosine search over every memory file, fully local</text>

  <!-- ══ Layer 4: living skills ══ -->
  <rect x="24" y="322" width="600" height="78" rx="8" fill="url(#panelBg)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="40" y="340" fill="#86efac" font-size="10" font-weight="700" letter-spacing="0.5">LAYER 4: LIVING SKILLS</text>
  <text x="608" y="340" text-anchor="end" fill="#94a3b8" font-size="9">on-demand</text>

  <rect x="40" y="350" width="80" height="24" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="80" y="366" text-anchor="middle" fill="#bbf7d0" font-size="9">/recall</text>
  <rect x="132" y="350" width="90" height="24" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="177" y="366" text-anchor="middle" fill="#bbf7d0" font-size="9">/journal</text>
  <rect x="234" y="350" width="90" height="24" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="0.8"/>
  <text x="279" y="366" text-anchor="middle" fill="#bbf7d0" font-size="9">/reflect</text>

  <text x="40" y="392" fill="#94a3b8" font-size="8.5">weekly synthesis promotes durable insights upward, human-approved</text>

  <!-- ══ Lifecycle rail ══ -->
  <rect x="648" y="52" width="228" height="348" rx="8" fill="url(#panelBg)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="664" y="74" fill="#d8b4fe" font-size="10" font-weight="700" letter-spacing="0.5">THE LIFECYCLE</text>
  <text x="860" y="74" text-anchor="end" fill="#94a3b8" font-size="9">the real feature</text>

  <rect x="664" y="92" width="196" height="30" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="0.8"/>
  <text x="762" y="111" text-anchor="middle" fill="#d8b4fe" font-size="9">1. capture daily</text>

  <line x1="762" y1="122" x2="762" y2="136" stroke="#a855f7" stroke-width="1" marker-end="url(#arrowPurple)"/>

  <rect x="664" y="140" width="196" height="30" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="0.8"/>
  <text x="762" y="159" text-anchor="middle" fill="#d8b4fe" font-size="9">2. search semantically</text>

  <line x1="762" y1="170" x2="762" y2="184" stroke="#a855f7" stroke-width="1" marker-end="url(#arrowPurple)"/>

  <rect x="664" y="188" width="196" height="30" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="0.8"/>
  <text x="762" y="207" text-anchor="middle" fill="#d8b4fe" font-size="9">3. synthesize weekly</text>

  <line x1="762" y1="218" x2="762" y2="232" stroke="#a855f7" stroke-width="1" marker-end="url(#arrowPurple)"/>

  <rect x="664" y="236" width="196" height="30" rx="5" fill="#1e293b" stroke="#a855f7" stroke-width="0.8"/>
  <text x="762" y="255" text-anchor="middle" fill="#d8b4fe" font-size="9">4. promote durably</text>

  <path d="M 664 330 C 636 330 636 107 664 107" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrowPurple)"/>
  <text x="762" y="300" text-anchor="middle" fill="#94a3b8" font-size="8.5">promoted insights feed</text>
  <text x="762" y="314" text-anchor="middle" fill="#94a3b8" font-size="8.5">back into MEMORY.md</text>
  <text x="762" y="352" text-anchor="middle" fill="#94a3b8" font-size="8.5">append-only daily logs,</text>
  <text x="762" y="366" text-anchor="middle" fill="#94a3b8" font-size="8.5">never edited, only promoted</text>

  <text x="450" y="438" text-anchor="middle" fill="#475569" font-size="9">the gap was automation glue, not features</text>
</svg>
